server:
  port: 8083

spring:
  application:
    name: servicio-pedidos
  datasource:
    url: jdbc:postgresql://localhost:5432/pedidos_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never

# TP-032 observabilidad
management:
  tracing:
    sampling:
      probability: 1.0   # trazamos todas las requests
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true

servicios:
  inventario:
    url: http://localhost:8082

batch:
  expiracion:
    scheduler-enabled: true
    cron: "0 0 2 * * *"
    zone: "America/Argentina/Buenos_Aires"